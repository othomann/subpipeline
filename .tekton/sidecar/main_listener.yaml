apiVersion: tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: template
spec:
  params:
    - name: repository
      description: The git repo
    - name: revision
      description: the branch for the git repo
  resourcetemplates:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: cd-secret
      type: Opaque
      stringData:
        OVPN_FILE: $(params.OVPN_FILE)
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        name: pipelinerun-$(uid)
      spec:
        pipelineRef:
            name: main-pipeline
        params:
        - name: repository
          value: $(params.repository)
        - name: revision
          value: $(params.revision)
---
apiVersion: tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: binding
spec:
  params:
    - name: repository
      value: "https://github.com/open-toolchain/hello-tekton"
    - name: revision
      value: "master"
    - name: ovpn_file
      value: $(params.OVPN_FILE)
---
apiVersion: tekton.dev/v1beta1
kind: EventListener
metadata:
  name: main-listener
spec:
  triggers:
    - binding:
        name: binding
      template:
        name: template
