apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-task
  annotations:
    io.kubernetes.cri.untrusted-workload: "false"
spec:
  params:
    - name: repository
      description: the git repo
    - name: revision
      description: the revision
      default: master
  volumes:
    - name: ovpn
      secret:
        secretName: cd-secret
  steps:
    - name: connectcluster
      image: icr.io/continuous-delivery/pipeline/pipeline-base-ubi:3.61
      command: ["/bin/sh", "-c"]
      args:
        - set -e -o pipefail;
          sleep 5m;  
  sidecars:
  - image: dperson/openvpn-client
    name: openvpn-side
    securityContext:
      privileged: true
    volumeMounts:
    - name: ovpn
      mountPath: /etc/ovpnconfig
      subPath: OVPN_FILE
      readOnly: true
    command: ["/bin/bash", "-c"]
    args:
      - |
        cat /etc/ovpnconfig | base64 -d >> bogvpn;
        openvpn --config bogvpn;
        
