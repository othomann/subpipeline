apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: print-versions-task
spec:
  params:
    - name: image_url
      description: the image url
  workspaces:
  - name: task-pvc
    mountPath: /artifacts
  steps:
    - name: print-versions
      image: $(params.image_url)
      imagePullPolicy: Always
      command: ["/bin/bash", "-c"]
      args:
        - |
          echo "test"
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_core_git_clone_time_summary":{"ibm_toolchain_pipeline_devsecops_time":"124","ibm_toolchain_pipeline_version":"v11","ibm_toolchain_pipeline_type":"ci"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_core_change_request_process_time_summary":{"ibm_toolchain_pipeline_devsecops_time":"165961","value":"7"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_core_pipeline_evaluation_time_summary":{"ibm_toolchain_pipeline_devsecops_time":"165961","ibm_toolchain_pipeline_devsecops_pipeline_type":"pr","value":"7"}}'; 
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_pipeline_info":{"ibm_toolchain_pipeline_devsecops_branch":"fix/v10-master-image-update","ibm_toolchain_pipeline_devsecops_pipeline_type":"ci", "value":"1"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_cli_artifact_upload_time_summary":{ "ibm_toolchain_pipeline_devsecops_time": "165961", "value": "7"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_cli_locker_evidence_summary_time_summary": { "ibm_toolchain_pipeline_devsecops_time": "165961", "value": "7"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_cli_locker_evidence_publish_time_summary": { "ibm_toolchain_pipeline_devsecops_time": "165961", "value": "7"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_cli_inventory_get_time_summary": { "ibm_toolchain_pipeline_devsecops_time": "165961", "value": "7"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_cli_commands_count": {"value": "1"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_cli_commands_success_count": {"value": "1"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_cli_commands_error_count": {"value": "1"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_cli_api_calls_count": {"value": "1"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_cli_github_api_calls_count": {"value": "1"}}';
          echo '::debug::{"ibm_toolchain_pipeline_devsecops_cli_cos_api_call_count":{"value": "1"}}';
          echo "all metrics are dumped"
